<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="t d">
  <title id="t">O que acontece quando você chama /money-coach</title>
  <desc id="d">Cinco etapas: você cria sua pasta, responde uma entrevista curta, recebe um diagnóstico com números, um plano pela escada de prioridades e acompanhamento mês a mês, tudo anotado na sua pasta.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C111B"/>
      <stop offset="1" stop-color="#18222F"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .rail{stroke:#2C3A4E;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 14;animation:flow 1.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-16}}
    .card{fill:#152030;stroke:#2C3A4E;stroke-width:3;animation:lit 10s infinite}
    @keyframes lit{0%,100%{stroke:#2C3A4E;fill:#152030}3%,17%{stroke:#F2C14E;fill:#1E2A3A}20%{stroke:#2C3A4E;fill:#152030}}
    .n1 .card{animation-delay:0s}.n2 .card{animation-delay:2s}.n3 .card{animation-delay:4s}.n4 .card{animation-delay:6s}.n5 .card{animation-delay:8s}
    .num{font-size:20px;font-weight:800;fill:#F2C14E;text-anchor:middle}
    .ttl{font-size:26px;font-weight:800;fill:#FFFFFF;text-anchor:middle}
    .sub{font-size:17px;fill:#A3B3C6;text-anchor:middle}
    .you{fill:#F2C14E}
    .youtxt{font-size:15px;font-weight:800;fill:#2A1E04;text-anchor:middle}
    .in{opacity:0;animation:rise .8s ease-out forwards}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1!important}}
  </style>

  <rect width="1280" height="380" rx="28" fill="url(#bg)"/>
  <text class="in" x="640" y="58" text-anchor="middle" font-size="30" font-weight="800" fill="#FFFFFF">O que acontece quando você chama <tspan fill="#F2C14E">/money-coach</tspan></text>

  <path id="trilho" d="M150 190 H1130" class="rail" fill="none"/>
  <circle r="9" fill="#F2C14E">
    <animateMotion dur="10s" repeatCount="indefinite"><mpath href="#trilho"/></animateMotion>
  </circle>
  <circle r="20" fill="#F2C14E" opacity=".22">
    <animateMotion dur="10s" repeatCount="indefinite"><mpath href="#trilho"/></animateMotion>
  </circle>

  <g class="n1" transform="translate(150 190)">
    <rect class="card" x="-100" y="-62" width="200" height="124" rx="20"/>
    <text class="num" y="-30">1</text>
    <text class="ttl" y="6">Sua pasta</text>
    <text class="sub" y="34">onde tudo fica anotado</text>
    <rect class="you" x="-48" y="76" width="96" height="26" rx="13"/>
    <text class="youtxt" y="94">você cria</text>
  </g>
  <g class="n2" transform="translate(395 190)">
    <rect class="card" x="-100" y="-62" width="200" height="124" rx="20"/>
    <text class="num" y="-30">2</text>
    <text class="ttl" y="6">Entrevista</text>
    <text class="sub" y="34">renda, dívidas, metas</text>
    <rect class="you" x="-56" y="76" width="112" height="26" rx="13"/>
    <text class="youtxt" y="94">você responde</text>
  </g>
  <g class="n3" transform="translate(640 190)">
    <rect class="card" x="-100" y="-62" width="200" height="124" rx="20"/>
    <text class="num" y="-30">3</text>
    <text class="ttl" y="6">Diagnóstico</text>
    <text class="sub" y="34">com os seus números</text>
  </g>
  <g class="n4" transform="translate(885 190)">
    <rect class="card" x="-100" y="-62" width="200" height="124" rx="20"/>
    <text class="num" y="-30">4</text>
    <text class="ttl" y="6">Plano</text>
    <text class="sub" y="34">um degrau por vez</text>
    <rect class="you" x="-48" y="76" width="96" height="26" rx="13"/>
    <text class="youtxt" y="94">você decide</text>
  </g>
  <g class="n5" transform="translate(1130 190)">
    <rect class="card" x="-100" y="-62" width="200" height="124" rx="20"/>
    <text class="num" y="-30">5</text>
    <text class="ttl" y="6">Acompanha</text>
    <text class="sub" y="34">mês a mês, sem esquecer</text>
  </g>

  <text class="in" x="640" y="338" text-anchor="middle" font-size="19" fill="#8E9FB3" style="animation-delay:.6s">A decisão é sempre sua. A conta honesta também.</text>
</svg>
